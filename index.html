<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ภาษาต่างด้าว ใน OBGYN — พม่าฉบับใช้งานจริง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Mali:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Noto+Sans+Myanmar:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --mint:#2fb8a8;--mint-d:#1d9488;--coral:#ff6f91;--coral-d:#f0396a;
    --pink-soft:#ffe3ec;--cream:#fff8f1;--ink:#28414a;--ink-soft:#5c7079;
    --yellow:#ffd166;--lilac:#a78bfa;--accent:var(--mint);--accent-d:var(--mint-d);
    --bg1:#eafaf6;--bg2:#fff6f8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Noto Sans Thai','Mali',sans-serif;background:#0e1417;color:var(--ink);overflow:hidden}
  #deck{position:fixed;inset:0}
  .slide{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    padding:2.4vh 4.5vw 5.5vh;text-align:center;background:linear-gradient(150deg,var(--bg1),var(--bg2));overflow:hidden}
  .slide.active{display:flex;animation:slideIn .5s cubic-bezier(.22,1,.36,1)}
  .slide.back.active{animation:slideInBack .5s cubic-bezier(.22,1,.36,1)}
  @keyframes slideIn{from{opacity:0;transform:translateX(6%) scale(.97)}to{opacity:1;transform:none}}
  @keyframes slideInBack{from{opacity:0;transform:translateX(-6%) scale(.97)}to{opacity:1;transform:none}}
  .blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.35;z-index:0;pointer-events:none}
  .blob.b1{width:36vw;height:36vw;background:radial-gradient(circle,#bff3ea,transparent 70%);top:-10vw;left:-8vw}
  .blob.b2{width:30vw;height:30vw;background:radial-gradient(circle,#ffd9e4,transparent 70%);bottom:-10vw;right:-6vw}
  .slide>*{position:relative;z-index:1}
  .pop{opacity:0}
  .slide.active .pop{animation:popIn .5s cubic-bezier(.22,1.4,.4,1) forwards;animation-delay:calc(var(--i,0)*.1s + .1s)}
  @keyframes popIn{0%{opacity:0;transform:translateY(24px) scale(.9)}60%{opacity:1}100%{opacity:1;transform:none}}
  h1{font-family:'Baloo 2';font-weight:800;line-height:1.1}
  .kicker{font-family:'Baloo 2';font-weight:700;letter-spacing:.03em;color:var(--accent-d);background:#fff;
    border:2px solid var(--accent);border-radius:999px;padding:.35em 1.2em;font-size:clamp(.8rem,1.9vw,1.15rem);
    display:inline-block;box-shadow:0 6px 0 rgba(0,0,0,.05)}
  .lead{color:var(--ink-soft);font-size:clamp(1rem,2.3vw,1.5rem);font-weight:500;max-width:26ch;line-height:1.5}
  .mascot{font-size:clamp(2.4rem,7vw,5rem);display:inline-block;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 8px 10px rgba(0,0,0,.12))}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)}}
  .corner-mascot{position:absolute;bottom:2.5vh;left:2.5vw;font-size:clamp(1.8rem,4vw,3rem);z-index:2;animation:bob 3s ease-in-out infinite;opacity:.9}
  .title-wrap h1{font-size:clamp(2.2rem,7vw,5.4rem);color:var(--ink)}
  .title-wrap .hl{color:var(--coral-d)}
  .subtitle{font-size:clamp(1.05rem,2.6vw,1.7rem);color:var(--ink-soft);font-weight:600;margin-top:.4em}
  .lang-chips{display:flex;gap:.6em;flex-wrap:wrap;justify-content:center;margin-top:1.4em}
  .chip{background:#fff;border-radius:14px;padding:.5em 1em;font-weight:600;color:var(--ink-soft);border:2px solid #eadfd6;font-size:clamp(.75rem,1.8vw,1.05rem)}
  .chip.on{background:var(--coral);color:#fff;border-color:var(--coral-d);transform:scale(1.12);box-shadow:0 10px 20px rgba(240,57,106,.35)}
  .divider .big-emoji{font-size:clamp(3.4rem,13vw,9rem);line-height:1}
  .divider h1{font-size:clamp(1.9rem,6vw,4.4rem)}
  .sec-num{font-family:'Baloo 2';font-weight:800;color:#fff;background:var(--accent);width:clamp(2.6rem,6vw,4rem);height:clamp(2.6rem,6vw,4rem);
    border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(1.2rem,3vw,2rem);margin:0 auto .3em}
  .phrase-grid{display:flex;flex-direction:column;gap:clamp(.4rem,1.1vh,.75rem);width:100%;max-width:1080px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:clamp(.7rem,2vw,1.3rem)}
  @media(max-width:760px){.row2{grid-template-columns:1fr}}
  .card{background:#fff;border-radius:20px;padding:clamp(.5rem,1.4vh,.85rem) clamp(1rem,2.6vw,1.5rem);
    box-shadow:0 12px 30px rgba(40,65,74,.11);border:2px solid #fff;text-align:left;position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--accent)}
  .card.warn::before{background:repeating-linear-gradient(45deg,var(--coral),var(--coral) 6px,#ffd0dc 6px,#ffd0dc 12px)}
  .card .en{font-size:clamp(.68rem,1.4vw,.9rem);color:var(--ink-soft);font-weight:600;letter-spacing:.02em;text-transform:uppercase;opacity:.7}
  .card .th-mean{font-size:clamp(.9rem,1.95vw,1.24rem);font-weight:700;color:var(--ink);margin:.05em 0 .22em;line-height:1.25}
  .say{display:flex;align-items:center;gap:.5em;flex-wrap:wrap}
  .say-tag{background:var(--coral);color:#fff;font-family:'Baloo 2';font-weight:700;font-size:clamp(.6rem,1.25vw,.8rem);padding:.18em .7em;border-radius:999px;white-space:nowrap;box-shadow:0 4px 10px rgba(240,57,106,.3)}
  .say-text{font-family:'Mali';font-weight:700;color:var(--coral-d);font-size:clamp(1rem,2.3vw,1.5rem);line-height:1.2}
  .bur-row{display:flex;align-items:center;gap:.5em;flex-wrap:wrap;margin-top:.28em}
  .bur{display:inline-flex;align-items:baseline;gap:.55em;flex-wrap:wrap;background:var(--pink-soft);border-radius:12px;padding:.3em .8em}
  .card.warn .bur{background:#fff2f5;border:1.5px dashed var(--coral)}
  .bur .my{font-family:'Noto Sans Myanmar';font-weight:600;color:#b32357;font-size:clamp(.95rem,2.15vw,1.45rem);line-height:1.5}
  .bur .rom{font-size:clamp(.68rem,1.5vw,.95rem);color:#9a6b7c;font-style:italic;font-weight:500}
  .flag{font-size:clamp(.6rem,1.25vw,.8rem);font-weight:700;color:#c81e52;background:#ffe0e8;border:1px solid #ffb9cb;border-radius:999px;padding:.12em .6em;white-space:nowrap}
  .play-btn{border:none;cursor:pointer;font-family:'Baloo 2','Noto Sans Thai',sans-serif;font-weight:700;
    background:linear-gradient(90deg,var(--mint),var(--mint-d));color:#fff;border-radius:999px;padding:.34em .9em;
    font-size:clamp(.7rem,1.45vw,.95rem);display:inline-flex;align-items:center;gap:.3em;box-shadow:0 6px 14px rgba(29,148,136,.32);transition:transform .12s;white-space:nowrap}
  .play-btn:hover{transform:translateY(-1px)}.play-btn:active{transform:scale(.94)}
  .play-btn.playing{animation:pjump .5s ease infinite;background:linear-gradient(90deg,var(--coral),var(--coral-d));box-shadow:0 6px 14px rgba(240,57,106,.4)}
  .play-btn.loading{opacity:.7}
  @keyframes pjump{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  .play-btn.mini{padding:.26em .66em;font-size:clamp(.64rem,1.35vw,.82rem)}
  .play-btn.mini .pl{display:none}
  .ram{display:inline-flex;align-items:center;gap:.5em;background:linear-gradient(90deg,var(--coral),var(--coral-d));color:#fff;font-family:'Baloo 2';font-weight:800;
    border-radius:999px;padding:.5em 1.4em;font-size:clamp(1rem,2.6vw,1.7rem);box-shadow:0 12px 26px rgba(240,57,106,.4);animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  .mic{animation:wob 1.2s ease-in-out infinite;display:inline-block}
  @keyframes wob{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
  .activity{background:linear-gradient(150deg,#fff4d6,#ffe3ec)}
  .act-card{background:#fff;border-radius:28px;padding:clamp(1.3rem,3.5vh,2.4rem) clamp(1.4rem,5vw,3rem);box-shadow:0 20px 50px rgba(40,65,74,.16);max-width:920px;border:3px dashed var(--coral)}
  .act-badge{font-family:'Baloo 2';font-weight:800;color:#fff;background:var(--coral);border-radius:999px;padding:.3em 1.2em;display:inline-block;font-size:clamp(.85rem,2vw,1.2rem);margin-bottom:.5em}
  .act-steps{text-align:left;font-size:clamp(.95rem,2.2vw,1.4rem);line-height:1.55;color:var(--ink);margin-top:.5em}
  .act-steps li{margin:.35em 0 .35em 1.2em}
  .num-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(.5rem,1.5vw,1rem);max-width:1000px;width:100%}
  @media(max-width:680px){.num-grid{grid-template-columns:repeat(2,1fr)}}
  .num{background:#fff;border-radius:18px;padding:clamp(.6rem,1.7vh,1rem) .4rem;box-shadow:0 10px 22px rgba(40,65,74,.1)}
  .num .d{font-family:'Baloo 2';font-weight:800;font-size:clamp(1.3rem,3.3vw,2.2rem);color:var(--mint-d)}
  .num .say-text{font-size:clamp(.95rem,2.2vw,1.5rem)}
  .num .my{font-family:'Noto Sans Myanmar';color:#b32357;font-size:clamp(.85rem,1.9vw,1.2rem)}
  .num .play-btn{margin-top:.35em}
  .slide-title{font-family:'Baloo 2';font-weight:800;font-size:clamp(1.25rem,3.5vw,2.2rem);color:var(--ink);margin-bottom:.15em;line-height:1.2}
  .slide-title .em{font-size:1.15em}
  .slide-sub{color:var(--ink-soft);font-weight:600;font-size:clamp(.8rem,1.9vw,1.15rem);margin-bottom:.7em}
  .note-box{background:#fff;border-left:8px solid var(--yellow);border-radius:14px;padding:1em 1.4em;max-width:860px;text-align:left;
    font-size:clamp(.88rem,1.95vw,1.18rem);color:var(--ink);line-height:1.55;box-shadow:0 10px 24px rgba(40,65,74,.1)}
  .list10{text-align:left;max-width:920px;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:.4em .9em;font-size:clamp(.85rem,1.9vw,1.2rem);color:var(--ink);font-weight:600}
  @media(max-width:700px){.list10{grid-template-columns:1fr}}
  .list10 .n{display:inline-flex;width:1.7em;height:1.7em;border-radius:50%;background:var(--accent);color:#fff;font-family:'Baloo 2';font-weight:800;align-items:center;justify-content:center;margin-right:.5em;font-size:.85em}
  .list10 div{display:flex;align-items:center;background:#fff;border-radius:12px;padding:.4em .7em;box-shadow:0 5px 14px rgba(40,65,74,.07)}
  .oneliner{background:#fff;border-radius:24px;padding:clamp(1.2rem,3.5vh,2.2rem) clamp(1.4rem,5vw,2.8rem);box-shadow:0 18px 44px rgba(40,65,74,.14);max-width:900px;border:3px solid var(--coral)}
  .oneliner .seq{font-family:'Mali';font-weight:700;color:var(--coral-d);font-size:clamp(1.05rem,2.6vw,1.8rem);line-height:1.7}
  #bar{position:fixed;top:0;left:0;height:6px;background:linear-gradient(90deg,var(--coral),var(--mint));z-index:50;transition:width .4s ease;box-shadow:0 1px 6px rgba(0,0,0,.15)}
  #counter{position:fixed;bottom:2.2vh;right:2.4vw;z-index:50;font-family:'Baloo 2';font-weight:700;color:var(--ink-soft);background:#fff;border-radius:999px;padding:.3em 1em;font-size:clamp(.75rem,1.6vw,1rem);box-shadow:0 6px 16px rgba(40,65,74,.14)}
  #hint{position:fixed;bottom:2.2vh;left:50%;transform:translateX(-50%);z-index:50;color:var(--ink-soft);font-size:.78rem;background:rgba(255,255,255,.7);border-radius:999px;padding:.25em .9em;opacity:.75;max-width:60vw;text-align:center}
  .nav-btn{position:fixed;top:50%;transform:translateY(-50%);z-index:50;background:#fff;border:none;width:clamp(2.4rem,5vw,3.4rem);height:clamp(2.4rem,5vw,3.4rem);border-radius:50%;cursor:pointer;font-size:1.4rem;color:var(--accent-d);box-shadow:0 8px 20px rgba(40,65,74,.18);opacity:.55;transition:opacity .2s}
  .nav-btn:hover{opacity:1}#prev{left:1.5vw}#next{right:1.5vw}
  #audio-mode{position:fixed;top:1.4vh;right:2.4vw;z-index:55;font-family:'Baloo 2','Noto Sans Thai',sans-serif;font-weight:700;font-size:clamp(.66rem,1.4vw,.9rem);background:#fff;color:var(--ink-soft);border:2px solid #e7dccf;border-radius:999px;padding:.3em .9em;cursor:pointer;box-shadow:0 5px 14px rgba(40,65,74,.12)}
  #audio-mode b{color:var(--mint-d)}
  #toast{position:fixed;bottom:8vh;left:50%;transform:translateX(-50%) translateY(20px);z-index:60;background:var(--ink);color:#fff;padding:.6em 1.1em;border-radius:12px;font-size:.85rem;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;max-width:82vw;text-align:center;line-height:1.4}
  #toast.show{opacity:.97;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="bar"></div>
<div id="deck"></div>
<button class="nav-btn" id="prev" aria-label="ก่อนหน้า">‹</button>
<button class="nav-btn" id="next" aria-label="ถัดไป">›</button>
<div id="counter"></div>
<div id="hint">◀ ▶ เปลี่ยนสไลด์ · 🔊 กดฟังเสียงพม่า (ต้องมีเน็ต)</div>
<button id="audio-mode" title="สลับแหล่งเสียง">🌐 เสียง: <b>ออนไลน์</b></button>
<div id="toast"></div>

<script>
const THEMES = {
  intro:{a:'#2fb8a8',ad:'#1d9488',b1:'#eafaf6',b2:'#fff6f8'},
  ob:{a:'#ff6f91',ad:'#f0396a',b1:'#ffeef3',b2:'#fff6ee'},
  gyne:{a:'#8b5cf6',ad:'#6d28d9',b1:'#f3ecff',b2:'#ffeef6'},
  post:{a:'#f5a524',ad:'#d98209',b1:'#fff6e2',b2:'#ffefe6'},
  summary:{a:'#2fb8a8',ad:'#1d9488',b1:'#eafaf6',b2:'#fff3f6'},
  activity:{a:'#f0396a',ad:'#c81e52',b1:'#fff4d6',b2:'#ffe3ec'}
};
const spk = (my, cls='play-btn') =>
  my ? `<button class="${cls}" data-my="${my.replace(/"/g,'&quot;')}" aria-label="ฟังเสียงพม่า">🔊 <span class="pl">ฟังเสียง</span></button>` : '';
const card = (o) => `
  <div class="card pop ${o.warn?'warn':''}" style="--i:${o.i||0}">
    <div class="en">${o.en||''}</div>
    <div class="th-mean">${o.mean}</div>
    <div class="say"><span class="say-tag"><span class="mic">🗣️</span> พูดตาม</span><span class="say-text">${o.say||''}</span></div>
    <div class="bur-row">
      <span class="bur"><span class="my">${o.my}</span>${o.rom?`<span class="rom">${o.rom}</span>`:''}</span>
      ${spk(o.my)}
      ${o.warn?'<span class="flag">⚠️ เช็คสำเนียง</span>':''}
    </div>
  </div>`;
const num = (o,i) => `
  <div class="num pop" style="--i:${i}">
    <div class="d">${o.d}</div><div class="say-text">${o.say}</div><div class="my">${o.my}</div>${spk(o.my,'play-btn mini')}
  </div>`;

const S = [];
const push = (o)=>S.push(o);

/* ===== INTRO ===== */
push({theme:'intro',mascot:'🩺',html:`
  <div class="title-wrap">
    <div class="mascot pop">🤰🩺👶</div>
    <div class="kicker pop" style="--i:1">Workshop · สื่อสารกับผู้ป่วยต่างด้าว</div>
    <h1 class="pop" style="--i:2">ภาษาต่างด้าว ใน <span class="hl">OBGYN</span></h1>
    <div class="subtitle pop" style="--i:3">เรียนภาษา<b style="color:var(--coral-d)">พม่า</b>ฉบับใช้งานจริง — ถามประวัติ &amp; สื่อสารข้างเตียง</div>
    <div class="lang-chips">
      <span class="chip on pop" style="--i:4">🇲🇲 วันนี้เน้น: พม่า</span>
      <span class="chip pop" style="--i:5">กะเหรี่ยง</span>
      <span class="chip pop" style="--i:5">กัมพูชา</span>
      <span class="chip pop" style="--i:6">ลาว</span>
    </div>
  </div>`});

push({theme:'intro',mascot:'😰',html:`
  <div class="mascot pop">🌙🏥</div>
  <div class="kicker pop" style="--i:1">ตี 3 · ห้องคลอด</div>
  <h1 class="pop" style="--i:2" >คุณแม่ชาวพม่ามาคลอด…</h1>
  <p class="lead pop" style="--i:3">เจ็บท้อง ร้องไห้ กลัว — และ<b style="color:var(--coral-d)">พูดไทยไม่ได้เลย</b></p>
  <p class="lead pop" style="--i:4" style="margin-top:.5em">ถ้าเป็นคุณ… จะเริ่มซักประวัติยังไง?</p>
  <div class="ram pop" style="--i:5" style="margin-top:1.1em">คำถามไม่กี่คำ เปลี่ยนทุกอย่างได้ ✨</div>`});

push({theme:'intro',mascot:'🎤',cls:'activity',html:`
  <div class="act-card">
    <span class="act-badge pop">กติกา · How to play</span>
    <div class="ram pop" style="--i:1" style="font-size:clamp(1.2rem,3.6vw,2.2rem)"><span class="mic">🎤</span> “REPEAT AFTER ME!”</div>
    <ol class="act-steps">
      <li class="pop" style="--i:2">เห็นป้าย <span class="say-tag" style="display:inline-block">🗣️ พูดตาม</span> → ทั้งห้องอ่าน<b style="color:var(--coral-d)">บรรทัดชมพู</b> (คำอ่านไทย) พร้อมกัน</li>
      <li class="pop" style="--i:3">กดปุ่ม <span class="play-btn" style="display:inline-flex">🔊 ฟังเสียง</span> เพื่อฟัง<b>เสียงพม่าจริง</b>ก่อนพูดตาม (ต้องมีเน็ต)</li>
      <li class="pop" style="--i:4">เห็น <span class="flag" style="display:inline">⚠️ ตรวจสำเนียง</span> = ประโยคนี้ยังไม่ได้ยืนยันโดยเจ้าของภาษา ใช้ด้วยความระวัง</li>
    </ol>
  </div>`});

push({theme:'intro',mascot:'🔤',html:`
  <div class="slide-title pop">อ่านการ์ดยังไง 👀</div>
  <div class="phrase-grid" style="max-width:920px">
    <div class="pop" style="--i:1">${card({en:'ตัวอย่าง',mean:'ตั้งครรภ์อยู่ไหมคะ',say:'โก่-วุน ชิ ลา',my:'ကိုယ်ဝန် ရှိလား',rom:'ko-won shi lar'})}</div>
    <div class="row2 pop" style="--i:2">
      <div class="card"><div class="en">บรรทัดชมพู 🗣️</div><div class="th-mean">คำอ่านไทย = พูดตามอันนี้</div></div>
      <div class="card"><div class="en">กล่องพม่า 🇲🇲 + 🔊</div><div class="th-mean">ตัวเขียนจริง · กดฟังเสียง</div></div>
    </div>
  </div>`});

/* ===== OB CLINIC ===== */
push({theme:'ob',divider:true,mascot:'🤰',html:`
  <div class="sec-num pop">OB</div>
  <div class="big-emoji pop" style="--i:1">🤰</div>
  <h1 class="pop" style="--i:2">คลินิกฝากครรภ์</h1>
  <p class="lead pop" style="--i:3">ประวัติตั้งครรภ์ · อาการปัจจุบัน · คัดกรองภาวะแทรกซ้อน</p>`});

push({theme:'ob',mascot:'📅',html:`

/* ---------- RENDER ---------- */
const deck = document.getElementById('deck');
S.forEach((s,idx)=>{
  const el = document.createElement('section');
  el.className = 'slide ' + (s.cls||'') + (s.divider?' divider':'');
  el.innerHTML = `<div class="blob b1"></div><div class="blob b2"></div>${s.html}` + (s.mascot?`<div class="corner-mascot">${s.mascot}</div>`:'');
  deck.appendChild(el);
});
const slides = [...document.querySelectorAll('.slide')];
let cur = 0, lastDir = 1;
function applyTheme(i){
  const t = THEMES[S[i].theme] || THEMES.intro; const r = document.documentElement.style;
  r.setProperty('--accent',t.a); r.setProperty('--accent-d',t.ad); r.setProperty('--bg1',t.b1); r.setProperty('--bg2',t.b2);
}
function show(i){
  i = Math.max(0, Math.min(S.length-1, i));
  if(typeof stopAudio==='function') stopAudio();
  lastDir = i>=cur ? 1 : -1;
  slides.forEach(s=>s.classList.remove('active','back'));
  applyTheme(i);
  const el = slides[i]; if(lastDir<0) el.classList.add('back');
  void el.offsetWidth; el.classList.add('active'); cur = i;
  document.getElementById('bar').style.width = ((i+1)/S.length*100)+'%';
  document.getElementById('counter').textContent = `${i+1} / ${S.length}`;
}
function next(){ if(cur<S.length-1) show(cur+1) }
function prev(){ if(cur>0) show(cur-1) }
document.getElementById('next').onclick = next;
document.getElementById('prev').onclick = prev;
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown','Enter'].includes(e.key)){e.preventDefault();next()}
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();prev()}
  else if(e.key==='Home'){show(0)} else if(e.key==='End'){show(S.length-1)}
});
let tx=0;
document.addEventListener('touchstart',e=>tx=e.changedTouches[0].clientX,{passive:true});
document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>50){dx<0?next():prev()}},{passive:true});
document.getElementById('deck').addEventListener('click',e=>{
  const pb = e.target.closest('.play-btn');
  if(pb){ e.stopPropagation(); playAu(pb); return; }
  if(!e.target.closest('.nav-btn')) next();
});

/* ---------- BURMESE AUDIO (real voice at runtime) ---------- */
/* No audio is bundled (offline synths mispronounce Burmese). On click we play a
   REAL Burmese voice: 1) online Google TTS, 2) the device's own Burmese voice.
   Needs internet for best result; offline falls back to a device voice if installed. */
let voiceMode = 'online';   // 'online' = Google TTS · 'device' = OS Burmese voice
let curAudio = null, myVoice = null;
function loadVoices(){
  try{
    const vs = speechSynthesis.getVoices();
    myVoice = vs.find(v=>/(^|[-_ ])my([-_].*)?$/i.test(v.lang)) || vs.find(v=>/burm|myanmar/i.test(v.name));
  }catch(e){}
}
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function stopAudio(){
  if(curAudio){ try{curAudio.pause();}catch(e){} curAudio=null; }
  if('speechSynthesis' in window){ try{speechSynthesis.cancel();}catch(e){} }
  document.querySelectorAll('.play-btn.playing,.play-btn.loading').forEach(b=>b.classList.remove('playing','loading'));
}
function gUrls(txt){
  const q = encodeURIComponent(txt);
  return [
    'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=my&q='+q,
    'https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=my&q='+q
  ];
}
function speakDevice(txt, done){
  if(!('speechSynthesis' in window) || !myVoice){ done(false); return; }
  try{
    const u = new SpeechSynthesisUtterance(txt);
    u.voice = myVoice; u.lang = myVoice.lang || 'my-MM'; u.rate = .8;
    u.onend = ()=>done(true); u.onerror = ()=>done(false);
    speechSynthesis.speak(u);
  }catch(e){ done(false); }
}
function tryUrls(urls, done){
  let i = 0;
  const attempt = ()=>{
    if(i>=urls.length){ done(false); return; }
    const a = new Audio(); curAudio = a; let started=false;
    a.src = urls[i++];
    a.onplaying = ()=>{ started=true; };
    a.onended = ()=>{ done(true); curAudio=null; };
    a.onerror = ()=>{ if(!started) attempt(); else { done(false); curAudio=null; } };
    const p = a.play();
    if(p && p.catch) p.catch(()=>{ if(!started) attempt(); });
  };
  attempt();
}
function playAu(btn){
  const txt = btn.dataset.my; if(!txt) return;
  stopAudio();
  btn.classList.add('playing','loading');
  const finish = (ok)=>{ btn.classList.remove('playing','loading'); if(!ok) toast('เล่นเสียงไม่ได้ — ตรวจอินเทอร์เน็ต แล้วกดใหม่ (หรือสลับเป็นเสียงเครื่องมุมขวาบน)'); };
  const goOnline = ()=> tryUrls(gUrls(txt),(ok)=> ok ? finish(true) : speakDevice(txt,(ok2)=>finish(ok2)));
  if(voiceMode==='device'){
    speakDevice(txt,(ok)=> ok ? finish(true) : goOnline());
  } else {
    goOnline();
  }
}
const modeBtn = document.getElementById('audio-mode');
function renderMode(){ modeBtn.innerHTML = voiceMode==='device' ? '📱 เสียง: <b>เครื่อง</b>' : '🌐 เสียง: <b>ออนไลน์</b>'; }
let toastT;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),3400); }
modeBtn.addEventListener('click',(e)=>{
  e.stopPropagation();
  voiceMode = voiceMode==='online' ? 'device' : 'online'; renderMode();
  toast(voiceMode==='online' ? 'เสียงออนไลน์ (Google · ต้องมีเน็ต · ตรงที่สุด)' : 'เสียงของเครื่อง (ถ้าติดตั้งภาษาพม่า · ออฟไลน์ได้)');
});
renderMode();
show(0);
</script>
